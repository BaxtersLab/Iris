[package]
name = "iris-ui"
version = "0.1.1"
edition = "2021"

# The Iris library (bootstrap runtime, ui_app, win32 helpers) lives at the
# crate root; the camera app is the `iris-ui` bin.
[lib]
path = "lib.rs"

[[bin]]
name = "iris-ui"
path = "main.rs"

[dependencies]
iris-core = { path = "../iris-core" }
iris-ipc = { path = "../iris-ipc" }
iris-hrt = { path = "../iris-hrt" }
iris-hal = { path = "../iris-hal" }
iris-capture = { path = "../iris-capture" }
iris-control = { path = "../iris-control" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
eframe = "0.27"
# Decodes the embedded window icon at startup. Pure Rust, no system libs, so
# the dependency-light rule holds; the alternative was committing raw RGBA,
# which nobody can open and review.
png = "0.17"
egui = "0.27"
tray-icon = "0.13"
global-hotkey = "0.4"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
hyper = { version = "0.14", features = ["full"] }

# For flock(2) in single_instance. libc is already in this workspace's graph
# via iris-hal, so this adds no new third-party crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
widestring = "0.5"
