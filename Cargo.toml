[workspace]
resolver = "2"
members = [
    "crates/iris-core",
    "crates/iris-ipc",
    "crates/iris-hrt",
    "crates/iris-hal",
    "crates/iris-control",
    "crates/iris-stream",
    "crates/iris-ui",
    "crates/iris-harness",
    # Added 2026-08-31. It carried an empty `[workspace]` table, which made it its
    # own workspace root and kept 308 lines of shipped code out of every gate
    # this box has ever run — it built with 8 warnings against a zero-warning
    # bar nobody was holding it to.
    "crates/iris-ipc-pipe-bridge",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
