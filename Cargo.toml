[workspace]
resolver = "2"
members = [
    "crates/iris-core",
    "crates/iris-ipc",
    "crates/iris-hrt",
    "crates/iris-hal",
    "crates/iris-capture",
    "crates/iris-control",
    "crates/iris-stream",
    "crates/iris-ui",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
