name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew update && brew install ffmpeg
          else
            echo "Installing ffmpeg via choco on Windows";
            choco install ffmpeg -y;
          fi
          # If installation succeeded, mark runner as having ffmpeg available
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "CI_FFMPEG=1" >> $GITHUB_ENV
          fi

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run deterministic harness runner (produce artifact)
        if: always()
        run: |
          if [ -d "crates/iris-harness" ]; then
            echo "Running harness runner to emit telemetry output";
            cargo run -p iris-harness --bin runner --quiet || true
          else
            echo "No harness present; skipping runner";
          fi

      - name: Upload harness-output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-output
          path: |
            harness-output/stream.ts
            harness-output/telemetry.jsonl

      - name: Run workspace tests
        run: cargo test --workspace --all-features -- -q

      - name: Run ffmpeg-dependent integration test (iris-capture)
        run: |
          # Run only the specific ffmpeg integration test to keep CI time bounded
          cargo test -p iris-capture ffmpeg_integration_end_to_end_pts_keyframe -- --exact --nocapture
      - name: Run deterministic harness (if present)
        if: always()
        run: |
          # If a deterministic harness crate exists, run its tests for CI determinism.
          if [ -d "crates/iris-harness" ]; then
            echo "Found deterministic harness; running harness tests";
            cargo test -p iris-harness -- --nocapture || true
          else
            echo "No harness present; skipping harness step";
          fi

      # NOTE: smoke test script retained at ./.github/scripts/ci-smoke.ps1 for
      # local diagnostic runs. It is intentionally not executed in CI by default.
